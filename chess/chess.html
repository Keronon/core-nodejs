<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui-touch-punch/0.2.3/jquery.ui.touch-punch.min.js"></script>
    <meta charset="UTF-8">
    <title>Online Chess</title>

    <link rel="stylesheet" href="./chess.css">
    <script type="module" src="./chess.js"></script>
</head>
<body>
    <div id="overlay"> <div id="popup"></div> </div>
    <div id="body">
        <div id="menu" class="menu-row">
            <button id="new"  class="btn">NEW GAME  </button>
            <button id="flip" class="btn">FLIP BOARD</button>
            <button id="undo" class="btn">UNDO MOVE </button>
            <button id="main" class="btn">MAIN MENU </button>
        </div>
        <div id="pieces" class="menu-col"></div>
        <div id="board"></div>
        <div id="board-mark-cols" class="menu-row">
            <p class="mark">a</p><p class="mark">b</p><p class="mark">c</p><p class="mark">d</p>
            <p class="mark">e</p><p class="mark">f</p><p class="mark">g</p><p class="mark">h</p>
        </div>
        <div id="board-mark-rows" class="menu-col">
            <p class="mark">8</p><p class="mark">7</p><p class="mark">6</p><p class="mark">5</p>
            <p class="mark">4</p><p class="mark">3</p><p class="mark">2</p><p class="mark">1</p>
        </div>
        <div id="move-record" class="menu-col"></div>
        <div id="game-record"><input type="text" id="game-input"/><button id="save-record" class="btn">🖫</button></div>
    </div>
</body>
</html>
