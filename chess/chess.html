<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui-touch-punch/0.2.3/jquery.ui.touch-punch.min.js"></script>
    <meta charset="UTF-8">
    <title>Online Chess</title>

    <link rel="stylesheet" href="./chess.css">
    <script type="module" src="./chess.js"></script>
</head>
<body>
    <div id="overlay"> <div id="popup"></div> </div>
    <div id="body">
        <div id="menu" class="flex-col">
            <div id="board-size" class="flex-col border">
                <p class="c">Board size:</p>
                <input type="number" step="1" id="board-x" class="c"/>
                <p class="c">X</p>
                <input type="number" step="1" id="board-y" class="c"/>
                <button id="save-size" class="btn">🖫</button>
            </div>
            <div id="mark-dir" class="flex-row border">
                <button id="mark-dir-x" class="btn flex-12">a ↦ h</button>
                <button id="mark-dir-y" class="btn flex-12">1 ↧ 8</button>
            </div>
            <button id="new"  class="btn">NEW GAME  </button>
            <button id="flip" class="btn">FLIP BOARD</button>
            <button id="undo" class="btn">UNDO MOVE </button>
            <button id="main" class="btn">MAIN MENU </button>
        </div>
        <div id="pieces" class="flex-row border"></div>
        <div id="board"></div>
        <div id="board-mark-x" class="flex-row"></div>
        <div id="board-mark-y" class="flex-col"></div>
        <div id="move-record" class="flex-col border"></div>
        <div id="game-record" class="border">
            <input type="text" id="game-input" class="flex-size" style="--val: 90%;"/>
            <button id="save-record" class="btn flex-size" style="--val: 8%;">🖫</button>
        </div>
    </div>
</body>
</html>
